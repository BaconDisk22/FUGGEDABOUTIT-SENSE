name: Publish Intel Mac release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    # Only release tags that point to commits already merged into master.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm tagged commit is on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Wait for matching Intel Mac build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/intel-mac.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=20" --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .head_branch == env.GITHUB_REF_NAME)] | first // empty')"
            if [[ -n "$run" ]]; then
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion' <<<"$run")"
              if [[ "$status" == completed ]]; then
                [[ "$conclusion" == success ]] || exit 1
                echo "RUN_ID=$(jq -r '.id' <<<"$run")" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            sleep 30
          done
          exit 1
      - name: Download verified build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name Fuggedaboutit-Sense-macOS-Intel --dir release
          find release -maxdepth 1 -name '*.dmg' | grep -q .
          shasum -a 256 release/*.dmg > release/SHA256SUMS.txt
      - name: Publish unsigned beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/SHA256SUMS.txt --verify-tag --generate-notes --prerelease --title "Fuggedaboutit Sense $GITHUB_REF_NAME (unsigned Intel Mac)"
