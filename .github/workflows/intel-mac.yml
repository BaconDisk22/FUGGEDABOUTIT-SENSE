name: Fuggedaboutit Sense Intel Mac
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: intel-mac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac-intel:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          (cd ui && npm ci)
          (cd api && npm ci)
          (cd electron && npm ci)
          (cd api/meshtastic-js && npm install && npm run build)
          (cd api/webbluetooth && npm install && npm run build:all)
      - name: Build bundled UI and API
        run: |
          (cd ui && npm run build)
          (cd api && npm run build)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make Jersey app icon
        run: |
          python -m pip install Pillow
          python scripts/make_mac_icon.py
      - name: Build unsigned Intel macOS DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: cd electron && npm run build:mac:intel
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fuggedaboutit-Sense-macOS-Intel
          path: electron/dist/*.dmg
          if-no-files-found: error
